<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#ff4d1c" />
    <title>AppO</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #ff4d1c;
        color: #fff;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: #fff;
        color: #ff4d1c;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.04em;
        margin: 0 auto 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 10px 0 0;
        opacity: 0.9;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark" aria-hidden="true">Ao</div>
        <h1>AppO</h1>
        <p>Le bon pro, sans attendre</p>
      </div>
    </main>
  </body>
</html>
